<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Happiness Bedding</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anuphan', sans-serif;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .login-card p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 2.5rem;
        }

        .login-card .logo-text {
            color: #FF8E26;
            font-weight: 800;
            margin-bottom: 2rem;
            display: block;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #fff;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF8E26;
            background: rgba(255,255,255,0.15);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: #FF8E26;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: #e07310;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 142, 38, 0.4);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <span class="logo-text">HAPPINESS BEDDING</span>
        <h2>ADMIN LOGIN</h2>
        <p>กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบจัดการ</p>

        <form id="loginForm">
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="adminPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
            <div id="errorMsg" class="error-msg">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>
        </form>
    </div>

    <script>
        const ADMIN_PASS = 'happybed888'; // รหัสผ่านเริ่มต้น

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            const errorEl = document.getElementById('errorMsg');

            if (pass === ADMIN_PASS) {
                // เก็บสถานะการ Login ไว้ใน Session (ปิดเบราว์เซอร์แล้วหาย)
                sessionStorage.setItem('hp_admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                errorEl.style.display = 'block';
                document.getElementById('adminPass').value = '';
            }
        };
    </script>
</body>
</html>
